<style>
:root{
  --bg:#eef0ef; --surface:#fff; --fg:#17251d; --muted:#586a5e; --line:#d7dcd8;
  --accent:#1d4ed8; --accent-bg:#eaf0fd; --pos:#15803d; --neg:#c62828;
  --c1:#1d4ed8; --c2:#0e9f6e; --c3:#d97706; --c4:#9333ea;
  --shadow:0 14px 36px -26px rgba(4,32,16,.45); --font:'Montserrat',Arial,Helvetica,sans-serif;
  --fb:#1877f2; --ig:#c13584;
  --warn-bg:#fff4de; --warn:#7a4e00;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10140f; --surface:#1a211a; --fg:#e9efea; --muted:#9db0a2; --line:#2c352c;
  --accent:#5b8bf0; --accent-bg:#1b2436; --pos:#5fd486; --neg:#ff8a8a;
  --c1:#5b8bf0; --c2:#34d399; --c3:#fbbf24; --c4:#c084fc;
  --shadow:0 14px 36px -26px rgba(0,0,0,.8);
  --warn-bg:#33290f; --warn:#f2c46b;
}}
[data-theme="dark"]{
  --bg:#10140f; --surface:#1a211a; --fg:#e9efea; --muted:#9db0a2; --line:#2c352c;
  --accent:#5b8bf0; --accent-bg:#1b2436; --pos:#5fd486; --neg:#ff8a8a;
  --c1:#5b8bf0; --c2:#34d399; --c3:#fbbf24; --c4:#c084fc;
  --shadow:0 14px 36px -26px rgba(0,0,0,.8);
  --warn-bg:#33290f; --warn:#f2c46b;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:44px;width:auto;display:block}
.brand h1{margin:0;font-size:19px;font-weight:800}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.btn{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px;border-radius:10px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:6px 10px;min-height:32px;font-size:12px}
.tabs{display:flex;gap:6px;padding-bottom:10px;flex-wrap:wrap}
.tab{font:inherit;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--muted);padding:8px 16px;border-radius:99px;cursor:pointer;min-height:38px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:18px 0 40px}
/* ---- Selector de trimestre ---- */
.qs-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.qs-year{font:inherit;font-size:13px;font-weight:700;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--fg);min-height:36px;cursor:pointer}
.qs-year:hover{border-color:var(--accent)}
.pill{font:inherit;font-size:12.5px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 14px;border-radius:99px;cursor:pointer;min-height:36px;white-space:nowrap;transition:border-color .15s}
.pill.on,.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.pill:hover:not(.on):not([aria-pressed="true"]){border-color:var(--accent)}
.pill:disabled{opacity:.38;cursor:default}
/* ---- Painéis ---- */
.sec-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec-panel>h2{margin:0 0 10px;font-size:16px;font-weight:800}
.sec-panel .sub{margin:2px 0 10px;color:var(--muted);font-size:12.5px}
/* ---- Resumo ---- */
.sum-title{font-size:15px;font-weight:800;margin:0 0 8px}
.sum-text p{margin:7px 0 0;line-height:1.65}
.sum-actions{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.toast{font-size:12px;color:var(--muted)}
/* ---- Alertas ---- */
.alerts-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.alerts-list li{padding:9px 12px;border-radius:10px;font-size:13.5px;background:var(--warn-bg);color:var(--warn)}
.alerts-list li.info{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
/* ---- KPI grid ---- */
.kpis-grid{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.kpi-card{all:unset;box-sizing:border-box;cursor:pointer;padding:16px 20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:block;width:100%}
.kpi-card:nth-child(3n){border-right:0}
.kpi-card:nth-last-child(-n+3){border-bottom:0}
.kpi-card[aria-pressed="true"]{background:var(--accent-bg);box-shadow:inset 0 -3px 0 var(--accent)}
.kpi-card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.kpi-card .kl{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.kpi-card .kv{display:block;font-size:26px;font-weight:800;line-height:1.2;margin:3px 0 6px;font-variant-numeric:tabular-nums}
.kpi-card .kd{display:block;font-size:12px;font-weight:700;line-height:1.6}
.kpi-card .kd.up{color:var(--pos)}.kpi-card .kd.dn{color:var(--neg)}.kpi-card .kd.nd{color:var(--muted)}
/* ---- Barras mensais ---- */
.month-bars{display:flex;gap:16px;align-items:flex-end;height:150px;padding:0 4px;border-bottom:1px solid var(--line);margin:12px 0 8px;overflow-x:auto}
.m-col{flex:1;min-width:52px;max-width:120px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.m-pair{display:flex;gap:5px;align-items:flex-end;width:100%;justify-content:center;height:120px}
.m-b{flex:1;max-width:40px;border-radius:4px 4px 0 0;min-height:2px}
.m-b.cur{background:var(--accent)}
.m-b.prev{background:var(--muted);opacity:.45}
.m-label{font-size:11px;color:var(--muted);margin-top:5px;font-weight:600;text-align:center}
/* ---- Exploração ---- */
details.sec-panel>summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none;display:flex;align-items:center;gap:8px;margin:-4px 0}
details.sec-panel>summary::-webkit-details-marker{display:none}
details.sec-panel>summary::before{content:'▶';font-size:10px;transition:transform .2s;display:inline-block;flex-shrink:0}
details[open].sec-panel>summary::before{transform:rotate(90deg)}
.expl-inner{margin-top:16px}
/* ---- Estilos legacy (mantidos) ---- */
.bar-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:99px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.dt{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
.dt input{font:inherit;width:106px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--fg);min-height:36px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;box-shadow:var(--shadow)}
.kpi[aria-pressed="true"]{border-color:var(--accent);outline:2px solid var(--accent-bg)}
.kpi .n{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;font-weight:700}
.kpi .d.up{color:var(--pos)} .kpi .d.dn{color:var(--neg)} .kpi .d.eq{color:var(--muted)}
.kpi svg{display:block;width:100%;height:30px;margin-top:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel h2{margin:0;font-size:16px;font-weight:800}
.panel .sub{margin:2px 0 12px;color:var(--muted);font-size:12.5px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.opts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.opts select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--fg);min-height:34px}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
#chart{position:relative}
#chart svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:3}
.twocol{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media(max-width:860px){.twocol{grid-template-columns:1fr}}
.twocol>*{min-width:0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
th{font-size:12px;color:var(--muted);font-weight:700}
tfoot td{font-weight:800;border-bottom:0}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:6px}
.msg{display:none;background:var(--accent-bg);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.msg.on{display:flex}
footer{margin-top:24px;text-align:center;color:var(--muted);font-size:12.5px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.skip:focus{position:fixed!important;top:10px;left:10px;width:auto;height:auto;clip:auto;clip-path:none;margin:0;background:var(--accent);color:#fff;padding:10px 14px;border-radius:10px;font-weight:700;z-index:9;text-decoration:none}
.msg .x{font:inherit;line-height:1;font-size:19px;font-weight:700;border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 8px;border-radius:8px;min-height:32px}
.msg .x:hover{color:var(--fg)}
.msg-acoes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* Mobile */
@media(max-width:620px){
  .kpis-grid{grid-template-columns:repeat(2,1fr)}
  .kpi-card:nth-child(3n){border-right:1px solid var(--line)}
  .kpi-card:nth-child(2n){border-right:0}
  .kpi-card:nth-last-child(-n+3){border-bottom:1px solid var(--line)}
  .kpi-card:nth-last-child(-n+2){border-bottom:0}
}
@media print{header .btn,.bar-ctl,.msg,.opts,footer,.tabs{display:none!important}body{background:#fff;color:#000}.panel,.kpi,.sec-panel{box-shadow:none;break-inside:avoid}}
/* ---- relatório trimestral ---- */
.relctl{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}
.relctl label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.relctl select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--fg);min-height:40px}
.relctl .chk{flex-direction:row;align-items:center;gap:6px;color:var(--fg);min-height:40px}
.sheet{background:#fff;color:#111;max-width:860px;margin:0 auto;padding:30px 34px;border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);font-family:var(--font)}
.sheet h1{font-size:21px;margin:0 0 2px;font-weight:800}
.sheet h2{font-size:17px;margin:0 0 10px;font-weight:800;padding-bottom:6px;border-bottom:2px solid #1d4ed8}
.sheet h3{font-size:13.5px;margin:16px 0 6px;font-weight:700}
.sheet .rh{display:flex;gap:16px;align-items:center;border-bottom:1px solid #d7dcd8;padding-bottom:14px;margin-bottom:6px}
.sheet .rh img{height:46px;width:auto}
.sheet .rh p{margin:0;font-size:12px;color:#444}
.sheet table{font-size:12px}
.sheet th{color:#444}
.sheet td,.sheet th{border-bottom:1px solid #dfe3e0}
.sheet th:first-child,.sheet td:first-child{position:static}
.sheet .secao{margin-top:22px}
.sheet .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet .mini>div{border:1px solid #e1e5e2;border-radius:8px;padding:6px 8px;break-inside:avoid}
.sheet .mini b{font-size:11.5px;display:block}
.sheet .mini svg{width:100%;height:auto;display:block}
.sheet .d.up{color:#15803d}.sheet .d.dn{color:#c62828}.sheet .d.eq{color:#666}
.sheet .ed{min-height:84px;border:1px dashed #b8c0ba;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5;white-space:pre-wrap;outline:none}
.sheet .ed:empty:before{content:attr(data-ph);color:#8a948d}
.sheet .ed:focus{border-color:#1d4ed8;background:#f7f9ff}
.sheet .nt{font-size:11px;color:#555;margin:8px 0 0}
.sheet .leg{font-size:11px;color:#555;margin:4px 0 0}
@media(max-width:700px){.sheet{padding:18px 14px}.sheet .mini{grid-template-columns:repeat(2,1fr)}}
@media print{
  @page{size:A4;margin:13mm}
  body.rel{background:#fff}
  body.rel header.top,body.rel .relctl,body.rel .msg,body.rel footer{display:none!important}
  body.rel main{padding:0}.sheet{border:0;box-shadow:none;border-radius:0;padding:0;max-width:none}
  .sheet .secao.novapag{break-before:page}
  .sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet .ed{border:0;padding:0;min-height:0}.sheet .ed:empty{display:none}
  .noprint{display:none!important}
  .sheet h3:has(+ .ed:empty){display:none}
  .sheet td,.sheet th{padding:3.5px 6px}
  .sheet table{break-inside:avoid}.sheet h2,.sheet h3{break-after:avoid}
  .sheet .secao{margin-top:10px}.sheet h3{margin:8px 0 4px}.sheet .rh{padding-bottom:8px}.sheet .nt{margin:5px 0 0}.sheet .mini>div{padding:4px 6px}.sheet .ed{font-size:12px}
}
</style>
</head>

/* =================== UTILIDADES =================== */
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function br(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function diffDays(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function fmt(n){return Math.round(n).toLocaleString('pt-BR')}
function slug(t){return t.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'')}
function mi(k){return METR[k]||{n:k,t:'sum',c:'--c1'}}

/* =================== DADOS =================== */
function clonar(o){return JSON.parse(JSON.stringify(o))}
function lerArquivos(){try{return JSON.parse(localStorage.getItem(STORE_ARQ)||'[]')}catch(e){return []}}
function salvarArquivos(a){try{localStorage.setItem(STORE_ARQ,JSON.stringify(a));return true}catch(e){return false}}
function aplicarLocais(){
  local=false;
  try{var l=localStorage.getItem(STORE);if(l){merge(DATA,JSON.parse(l));local=true}}catch(e){}
  lerArquivos().forEach(function(a){
    if(a.nomeMetrica&&!METR[a.key])METR[a.key]={n:a.nomeMetrica,t:'sum',c:'--c3'};
    var add={series:{}};add.series[a.plat]={};add.series[a.plat][a.key]=a.rows;
    if(a.atualizado)add.atualizado=a.atualizado;
    merge(DATA,add);local=true;
  });
}
function reconstruir(){DATA=clonar(BASE);FZ={};aplicarLocais()}
function erroCarga(e){
  var t=$('tabs');if(t)t.innerHTML='';
  $('app').innerHTML='<div class="panel"><div class="empty"><b>Não foi possível carregar os dados</b>O arquivo dados/metricas.json não respondeu. Se esta página foi aberta direto do computador, publique-a no servidor: o navegador bloqueia a leitura de arquivos locais.<br><br>Detalhe técnico: '+esc(e&&e.message?e.message:e)+'</div></div>';
}
function loadData(cb){
  fetch('dados/metricas.json',{cache:'no-cache'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(d){BASE=d;reconstruir();cb()})
    .catch(erroCarga);
}
function merge(a,b){
  Object.keys(b.series||{}).forEach(function(p){
    a.series[p]=a.series[p]||{};
    Object.keys(b.series[p]).forEach(function(m){
      a.series[p][m]=a.series[p][m]||{};
      Object.keys(b.series[p][m]).forEach(function(d){a.series[p][m][d]=b.series[p][m][d]});
    });
  });
  if(b.atualizado&&(!a.atualizado||b.atualizado>a.atualizado))a.atualizado=b.atualizado;
}
function last(){
  var mx='';
  Object.keys(DATA.series).forEach(function(p){Object.keys(DATA.series[p]).forEach(function(m){Object.keys(DATA.series[p][m]).forEach(function(d){if(d>mx)mx=d})})});
  return mx||iso(new Date());
}
function first(){
  var mn='9999';
  Object.keys(DATA.series).forEach(function(p){Object.keys(DATA.series[p]).forEach(function(m){Object.keys(DATA.series[p][m]).forEach(function(d){if(d<mn)mn=d})})});
  return mn==='9999'?iso(new Date()):mn;
}
function hasData(p){
  if(p==='consolidado')return PLAT_BASICOS.some(function(x){return hasData(x)});
  var s=DATA.series[p];return s&&Object.keys(s).some(function(m){return Object.keys(s[m]).length});
}

/* =================== SÉRIE COM PLATAFORMA EXPLÍCITA =================== */
function rngP(plat,m,a,b){
  if(plat==='consolidado'){
    var combined={};
    PLAT_BASICOS.forEach(function(p){
      var s=(DATA.series[p]||{})[m]||{};
      Object.keys(s).forEach(function(d){if(d>=a&&d<=b)combined[d]=(combined[d]||0)+s[d]});
    });
    var o=[],d=a;
    while(d<=b){o.push({d:d,v:combined[d]||0,has:combined[d]!==undefined});d=addDays(d,1)}
    return o;
  }
  var s=(DATA.series[plat]||{})[m]||{},o=[],d=a;
  while(d<=b){o.push({d:d,v:s[d]||0,has:s[d]!==undefined});d=addDays(d,1)}
  return o;
}
function totalArr(arr){return arr.reduce(function(a,x){return a+x.v},0)}
function kvP(plat,m,a,b){
  var arr=rngP(plat,m,a,b),mm=mi(m);
  if(mm.t!=='avg')return totalArr(arr);
  var com=arr.filter(function(x){return x.has});
  return com.length?totalArr(com)/com.length:0;
}
var FZP={};
function firstNZP(plat,m){
  if(plat==='consolidado'){
    var d1=firstNZP('facebook',m),d2=firstNZP('instagram',m);
    if(!d1&&!d2)return null;
    if(!d1)return d2;if(!d2)return d1;
    return d1<d2?d1:d2;
  }
  var ch=plat+'|'+m;
  if(FZP[ch]!==undefined)return FZP[ch];
  var o=(DATA.series[plat]||{})[m]||{},k=Object.keys(o).filter(function(d){return o[d]>0}).sort();
  return FZP[ch]=k.length?k[0]:null;
}
function coberturaP(plat,m,a,b){
  if(plat==='consolidado'){
    var covered={};
    PLAT_BASICOS.forEach(function(p){
      var s=(DATA.series[p]||{})[m]||{},fz=firstNZP(p,m);
      if(!fz)return;
      Object.keys(s).forEach(function(d){if(d>=a&&d<=b&&d>=fz)covered[d]=1});
    });
    var c=Object.keys(covered).length,t=diffDays(a,b)+1;
    return t>0?c/t:0;
  }
  var s=(DATA.series[plat]||{})[m]||{},fz=firstNZP(plat,m),c=0,k;
  if(!fz)return 0;
  for(k in s){if(k>=a&&k<=b&&k>=fz)c++}
  var t=diffDays(a,b)+1;
  return t>0?c/t:0;
}
function comparavelP(plat,m,a,b){return coberturaP(plat,m,a,b)>=0.8}
function engRate(plat,a,b){
  var vis=kvP(plat,'visualizacoes',a,b);
  if(!vis)return null;
  return kvP(plat,'interacoes',a,b)/vis*100;
}

/* =================== TRIMESTRES =================== */
function qRange(Y,q){
  var m1=(q-1)*3+1,m3=q*3,dim=new Date(Y,m3,0).getDate(),u=last();
  var a=Y+'-'+pad(m1)+'-01',b=Y+'-'+pad(m3)+'-'+pad(dim);
  return {a:a,b:b>u?u:b,full:b<=u,fim:b};
}
function availQs(){
  var avail=[],u=last(),f=first();
  if(!u||!f)return avail;
  var fy=+f.slice(0,4),fq=Math.ceil(+f.slice(5,7)/3);
  var uy=+u.slice(0,4),uq=Math.ceil(+u.slice(5,7)/3);
  for(var y=fy;y<=uy;y++){
    for(var q=1;q<=4;q++){
      if(y===fy&&q<fq)continue;
      if(y===uy&&q>uq)continue;
      avail.push({y:y,q:q,partial:!qRange(y,q).full});
    }
  }
  return avail;
}
function availYears(){
  var qs=availQs(),years=[];
  qs.forEach(function(x){if(years.indexOf(x.y)<0)years.push(x.y)});
  return years;
}
function defaultQ(){
  var qs=availQs();if(!qs.length)return null;
  var complete=qs.filter(function(x){return !x.partial});
  return complete.length?complete[complete.length-1]:qs[qs.length-1];
}

/* =================== KPIs =================== */
var KPI_FB=[
  {k:'visualizacoes',l:'Visualizações'},
  {k:'interacoes',l:'Interações'},
  {k:'engajamento',l:'Taxa de engajamento'},
  {k:'cliques',l:'Cliques no link'},
  {k:'visitas',l:'Visitas ao perfil'},
  {k:'seguidores',l:'Novos seguidores'}
];
var KPI_IG=[
  {k:'visualizacoes',l:'Visualizações'},
  {k:'alcance',l:'Alcance (média/dia)'},
  {k:'interacoes',l:'Interações'},
  {k:'engajamento',l:'Taxa de engajamento'},
  {k:'cliques',l:'Cliques no link'},
  {k:'seguidores',l:'Novos seguidores'}
];
var KPI_CON=[
  {k:'visualizacoes',l:'Visualizações'},
  {k:'interacoes',l:'Interações'},
  {k:'engajamento',l:'Taxa de engajamento'},
  {k:'cliques',l:'Cliques no link'},
  {k:'visitas',l:'Visitas ao perfil'},
  {k:'seguidores',l:'Novos seguidores'}
];
function kpiDefs(plat){return plat==='instagram'?KPI_IG:plat==='consolidado'?KPI_CON:KPI_FB}
function kpiVal(plat,k,a,b){
  if(k==='engajamento')return engRate(plat,a,b);
  return kvP(plat,k,a,b);
}
function kpiComparavel(plat,k,a,b){
  if(k==='engajamento')return comparavelP(plat,'visualizacoes',a,b)&&comparavelP(plat,'interacoes',a,b);
  return comparavelP(plat,k,a,b);
}
function fmtKPI(k,v){
  if(v===null||v===undefined)return 'n/d';
  if(k==='engajamento')return v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
  if(k==='alcance')return fmt(v)+'/dia';
  return fmt(v);
}
function deltaHTML(k,cur,ref,label){
  if(ref===null||ref===undefined||!(ref>0))return '';
  if(k==='engajamento'){
    var dd=cur-ref;
    return '<span class="kd '+(dd>=0?'up':'dn')+'">'+(dd>=0?'▲ +':'▼ −')+Math.abs(dd).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' p.p. '+label+'</span>';
  }
  var p=(cur-ref)/ref*100;
  return '<span class="kd '+(p>=0?'up':'dn')+'">'+(p>=0?'▲ ':'▼ ')+p.toLocaleString('pt-BR',{maximumFractionDigits:1})+'% '+label+'</span>';
}

/* =================== RESUMO =================== */
function resumoTexto(plat,y,q,cur,pq,py){
  var V=kvP(plat,'visualizacoes',cur.a,cur.b);
  var I=kvP(plat,'interacoes',cur.a,cur.b);
  var S=kvP(plat,'seguidores',cur.a,cur.b);
  var C=kvP(plat,'cliques',cur.a,cur.b);
  var VP=kvP(plat,'visitas',cur.a,cur.b);
  var eng=V>0?(I/V*100):null;
  var pqLabel=q===1?'4º tri de '+(y-1):(q-1)+'º tri de '+y;
  var pyLabel=q+'º tri de '+(y-1);
  var pqV=kpiComparavel(plat,'visualizacoes',pq.a,pq.b)?kvP(plat,'visualizacoes',pq.a,pq.b):null;
  var pyV=kpiComparavel(plat,'visualizacoes',py.a,py.b)?kvP(plat,'visualizacoes',py.a,py.b):null;
  var pqI=kpiComparavel(plat,'interacoes',pq.a,pq.b)?kvP(plat,'interacoes',pq.a,pq.b):null;
  var pyI=kpiComparavel(plat,'interacoes',py.a,py.b)?kvP(plat,'interacoes',py.a,py.b):null;
  var pqS=kpiComparavel(plat,'seguidores',pq.a,pq.b)?kvP(plat,'seguidores',pq.a,pq.b):null;
  var pyS=kpiComparavel(plat,'seguidores',py.a,py.b)?kvP(plat,'seguidores',py.a,py.b):null;
  function pct(a,b){if(b===null||!(b>0))return '';var p=(a-b)/b*100;return (p>=0?'+':'')+p.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%'}
  var t1='Visualizações: <b>'+fmt(V)+'</b>';
  if(pqV!==null){var pv1=pct(V,pqV);t1+=' ('+(pv1||'mesmo valor')+' vs '+pqLabel+')'}
  if(pyV!==null){var pv2=pct(V,pyV);t1+=' e '+(pv2||'mesmo valor')+' vs '+pyLabel}
  t1+='.';
  var t2='Interações: <b>'+fmt(I)+'</b>';
  if(pqI!==null){t2+=' ('+pct(I,pqI)+' vs '+pqLabel+')'}
  var pqEng=null,pyEng=null;
  if(pqI!==null&&pqV!==null&&pqV>0)pqEng=pqI/pqV*100;
  if(pyI!==null&&pyV!==null&&pyV>0)pyEng=pyI/pyV*100;
  if(eng!==null)t2+='. Taxa de engajamento: <b>'+eng.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%</b>'+(pyEng!==null?' (era '+pyEng.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'% em '+pyLabel+')':'');
  t2+='.';
  var t3='Novos seguidores: <b>'+fmt(S)+'</b>';
  if(pqS!==null)t3+=' ('+pct(S,pqS)+' vs '+pqLabel+')';
  if(pyS!==null)t3+=', '+pct(S,pyS)+' vs '+pyLabel;
  t3+='.';
  var t4='Cliques no link: <b>'+fmt(C)+'</b>.'+(VP>0?' Visitas ao perfil: <b>'+fmt(VP)+'</b>.':'');
  return '<p>'+t1+'</p><p>'+t2+'</p><p>'+t3+'</p><p>'+t4+'</p>';
}

/* =================== ALERTAS =================== */
function alertasHTML(plat,y,q,cur){
  var al=[];
  if(!cur.full)al.push({txt:'Trimestre em andamento: dados até '+br(cur.b)+'. As comparações com o trimestre anterior podem estar subestimadas.',tipo:''});
  /* Pico mensal */
  var vizMes=[];
  for(var i=0;i<3;i++){
    var mo=(q-1)*3+1+i;if(mo>12)break;
    var ma=y+'-'+pad(mo)+'-01',mdim=new Date(y,mo,0).getDate(),mb=y+'-'+pad(mo)+'-'+pad(mdim);
    if(mb>cur.b)mb=cur.b;if(ma>cur.b)break;
    vizMes.push({m:MESES[mo-1],v:kvP(plat,'visualizacoes',ma,mb)});
  }
  var totalViz=vizMes.reduce(function(a,x){return a+x.v},0);
  if(totalViz>0){
    vizMes.forEach(function(x){
      if(x.v/totalViz>0.5)al.push({txt:'Destaque: '+x.m+' concentra '+Math.round(x.v/totalViz*100)+'% das visualizações do trimestre.',tipo:''});
    });
  }
  /* Métricas sem dados */
  var semDados=[];
  ['cliques','visitas'].forEach(function(m){
    if(!firstNZP(plat,m))semDados.push(mi(m).n);
  });
  if(semDados.length)al.push({txt:semDados.join(' e ')+': sem registro para o período. Aparece como n/d, não como zero.',tipo:'info'});
  if(!firstNZP(plat,'visualizacoes'))al.push({txt:'Nenhum dado disponível para '+NOMES[plat]+' neste trimestre.',tipo:''});
  /* Avisos específicos do Consolidado */
  if(plat==='consolidado'){
    al.push({txt:'Visualizações do Instagram incluem ~1% de reproduções do Facebook — verifique dupla contagem antes de somar as redes.',tipo:'info'});
    al.push({txt:'Alcance e Visualizadores únicos não são exibidos no Consolidado: a mesma pessoa pode aparecer nas duas redes. Use as abas individuais para essas métricas.',tipo:'info'});
    al.push({txt:'Escala assimétrica: Instagram tem ~20× o volume do Facebook em visualizações. Os totais consolidados são dominados pelo Instagram.',tipo:'info'});
  }
  if(!al.length)al.push({txt:'Nenhum ponto de atenção identificado neste trimestre.',tipo:'info'});
  return al.map(function(a){return '<li class="'+(a.tipo||'')+(a.tipo===''?'':'')+'">'+(a.tipo==='info'?'ⓘ ':'⚠ ')+esc(a.txt)+'</li>'}).join('');
}

/* =================== BARRAS MENSAIS =================== */
function monthBarsHTML(plat,y,q,cur,k){
  var H=120;
  var months=[];
  for(var i=0;i<3;i++){
    var mo=(q-1)*3+1+i;if(mo>12)break;
    var ma=y+'-'+pad(mo)+'-01',mdim=new Date(y,mo,0).getDate(),mb=y+'-'+pad(mo)+'-'+pad(mdim);
    if(ma>cur.b)break;if(mb>cur.b)mb=cur.b;
    var pma=(y-1)+'-'+pad(mo)+'-01',pmb=(y-1)+'-'+pad(mo)+'-'+pad(mdim);
    var curVal,pyVal=null;
    if(k==='engajamento'){
      var v2=kvP(plat,'visualizacoes',ma,mb),i2=kvP(plat,'interacoes',ma,mb);
      curVal=v2>0?i2/v2*100:0;
      if(comparavelP(plat,'visualizacoes',pma,pmb)&&comparavelP(plat,'interacoes',pma,pmb)){
        var pv2=kvP(plat,'visualizacoes',pma,pmb),pi2=kvP(plat,'interacoes',pma,pmb);
        pyVal=pv2>0?pi2/pv2*100:0;
      }
    } else {
      var curCov2=coberturaP(plat,k,ma,mb);
      curVal=curCov2>0.10?kvP(plat,k,ma,mb):null;
      pyVal=comparavelP(plat,k,pma,pmb)?kvP(plat,k,pma,pmb):null;
    }
    months.push({l:MESES[mo-1],cur:curVal===null?0:Math.max(0,curVal),py:pyVal,nd:curVal===null});
  }
  if(!months.length)return '';
  var mx=Math.max.apply(null,months.map(function(x){return Math.max(x.cur,x.py||0)}))||1;
  var bars=months.map(function(x){
    var hcur=x.nd?0:Math.max(2,(x.cur/mx)*H);
    var hpy=x.py!==null?Math.max(2,(x.py/mx)*H):0;
    return '<div class="m-col">'+
      '<div class="m-pair">'+
      (x.py!==null?'<div class="m-b prev" style="height:'+hpy+'px" title="'+(y-1)+': '+(k==='engajamento'?x.py.toLocaleString('pt-BR',{maximumFractionDigits:2})+'%':fmt(x.py))+'"></div>':'')+
      (x.nd?'<div class="m-b cur" style="height:4px;opacity:.25" title="n/d"></div>':'<div class="m-b cur" style="height:'+hcur+'px" title="'+y+': '+(k==='engajamento'?x.cur.toLocaleString('pt-BR',{maximumFractionDigits:2})+'%':fmt(x.cur))+'"></div>')+
      '</div>'+
      '<div class="m-label">'+x.l+'</div>'+
      '</div>';
  }).join('');
  return '<div class="month-bars">'+bars+'</div>'+
    '<p class="note">Barra escura = '+y+'&nbsp;&nbsp;·&nbsp;&nbsp;Barra clara = '+( y-1)+'</p>';
}

/* =================== TABELA MENSAL =================== */
function tabelaMensalHTML(plat,y,q,cur){
  var defs=kpiDefs(plat).filter(function(d){return d.k!=='engajamento'&&d.k!=='alcance'});
  var head='<tr><th>Mês</th>'+defs.map(function(d){return '<th>'+esc(d.l)+'</th>'}).join('')+'</tr>';
  var rows='',tots=defs.map(function(){return 0}),totHas=defs.map(function(){return false});
  var anyRow=false;
  for(var i=0;i<3;i++){
    var mo=(q-1)*3+1+i;if(mo>12)break;
    var ma=y+'-'+pad(mo)+'-01',mdim=new Date(y,mo,0).getDate(),mb=y+'-'+pad(mo)+'-'+pad(mdim);
    if(ma>cur.b)break;if(mb>cur.b)mb=cur.b;
    anyRow=true;
    rows+='<tr><td>'+MESES[mo-1]+(mb<y+'-'+pad(mo)+'-'+pad(mdim)?' *':'')+'</td>';
    defs.forEach(function(d,j){
      /* Cobertura < 10%: dados insuficientes → n/d (evita zeros e negativos enganosos) */
      var cov=coberturaP(plat,d.k,ma,mb);
      var v=cov>0.10?kvP(plat,d.k,ma,mb):null;
      if(v!==null&&mi(d.k).t==='sum'){tots[j]+=v;totHas[j]=true;}
      rows+='<td>'+(v!==null?fmtKPI(d.k,v):'<span style="color:var(--muted)">n/d</span>')+'</td>';
    });
    rows+='</tr>';
  }
  if(!anyRow)return '';
  rows+='<tr class="tot"><td>Total / tri</td>'+defs.map(function(d,j){return '<td>'+(mi(d.k).t==='sum'?(totHas[j]?fmtKPI(d.k,tots[j]):'<span style="color:var(--muted)">n/d</span>'):'-')+'</td>'}).join('')+'</tr>';
  return '<div class="tw"><table><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div>';
}

/* =================== RENDER PAINEL TRIMESTRAL =================== */
function renderPainel(){
  var app=$('app');
  if(!DATA){app.innerHTML='<div class="panel"><div class="empty">Carregando…</div></div>';return}
  /* Garantir ano/trimestre */
  if(!st.year||!st.quarter){var dq=defaultQ();if(dq){st.year=dq.y;st.quarter=dq.q}else{app.innerHTML='<div class="panel"><div class="empty"><b>Sem dados disponíveis</b>Verifique se o arquivo dados/metricas.json foi gerado corretamente.</div></div>';return}}
  var Y=st.year,q=st.quarter;
  var cur=qRange(Y,q);
  var pq=q===1?qRange(Y-1,4):qRange(Y,q-1);
  var py=qRange(Y-1,q);
  var plat=st.plat;
  var pqLabel=q===1?'4ºtri/'+(Y-1).toString().slice(2):(q-1)+'ºtri/'+String(Y).slice(2);
  var pyLabel=q+'ºtri/'+(Y-1).toString().slice(2);
  var qs=availQs();
  var years=availYears();
  /* ---- Seletor de ano ---- */
  var yearSel='<select class="qs-year" id="qs-year" aria-label="Ano">'+years.map(function(yr){return '<option value="'+yr+'"'+(yr===Y?' selected':'')+'>'+yr+'</option>'}).join('')+'</select>';
  /* ---- Pills de trimestre ---- */
  var pills=[1,2,3,4].map(function(qi){
    var avail=qs.some(function(x){return x.y===Y&&x.q===qi});
    var partial=qs.some(function(x){return x.y===Y&&x.q===qi&&x.partial});
    var label=qi+'º tri'+(partial?' ◑':'');
    return '<button class="pill'+(qi===q&&Y===st.year?' on':'')+'" data-qsel="'+qi+'"'+(avail?'':' disabled')+' aria-pressed="'+(qi===q&&Y===st.year)+'" title="'+qi+'º trimestre de '+Y+(partial?' (em andamento)':'')+'">'+label+'</button>';
  }).join('');
  /* ---- Painel de resumo ---- */
  var titulo=q+'º trimestre de '+Y+' — '+NOMES[plat];
  var resumo=resumoTexto(plat,Y,q,cur,pq,py);
  /* ---- Alertas ---- */
  var alertas=alertasHTML(plat,Y,q,cur);
  /* ---- KPI cards ---- */
  var defs=kpiDefs(plat);
  var kpiCards=defs.map(function(d,idx){
    var curVal=kpiVal(plat,d.k,cur.a,cur.b);
    /* Só mostra comparações se o trimestre atual tiver cobertura suficiente (≥80%) */
    var curCov=kpiComparavel(plat,d.k,cur.a,cur.b);
    var pqVal=curCov&&kpiComparavel(plat,d.k,pq.a,pq.b)?kpiVal(plat,d.k,pq.a,pq.b):null;
    var pyVal=curCov&&kpiComparavel(plat,d.k,py.a,py.b)?kpiVal(plat,d.k,py.a,py.b):null;

function setPreset(p){
  st.preset=p;var u=last(),f=first();

  else if(p==='mes'){st.ini=u.slice(0,8)+'01';st.fim=u}
  else if(p==='90'||p==='30'||p==='7'){st.ini=addDays(u,-(+p-1));st.fim=u}
  else if(p==='tudo'){st.ini=f;st.fim=u}
  if(st.ini<f)st.ini=f;
}
function rng(m,a,b){
  var s=(DATA.series[st.plat]||{})[m]||{},o=[],d=a;
  while(d<=b){o.push({d:d,v:s[d]||0,has:s[d]!==undefined});d=addDays(d,1)}
  return o;
}
function total(arr){return arr.reduce(function(a,x){return a+x.v},0)}
function kv(m,arr){
  var mm=mi(m);
  if(mm.t!=='avg')return total(arr);
  var com=arr.filter(function(x){return x.has});
  return com.length?total(com)/com.length:0;
}
function cobertura(m,a,b){
  var s=(DATA.series[st.plat]||{})[m]||{},fz=firstNZ(m),c=0,k;
  if(!fz)return 0;
  for(k in s){if(k>=a&&k<=b&&k>=fz)c++}
  var t=diffDays(a,b)+1;
  return t>0?c/t:0;
}
function comparavel(m,a,b){return cobertura(m,a,b)>=0.8}

/* =================== GRÁFICOS =================== */
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function spark(arr,color){
  var W=160,H=30,mx=Math.max.apply(null,arr.map(function(x){return x.v}))||1,n=arr.length;
  if(n<2)return '';
  var step=Math.max(1,Math.ceil(n/60)),pts=[];
  for(var i=0;i<n;i+=step){var s=0,c=0;for(var j=i;j<Math.min(n,i+step);j++){s+=arr[j].v;c++}pts.push(s/c)}
  var m2=Math.max.apply(null,pts)||1;
  var d=pts.map(function(v,i){return (i?'L':'M')+(i*W/(pts.length-1)).toFixed(1)+' '+(H-2-(v/m2)*(H-5)).toFixed(1)}).join(' ');
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>';
}
function bucketize(arr,b){
  if(b==='dia')return arr.map(function(x){return {l:br(x.d),s:x.d,v:x.v,d:x.d}});
  var map={},ord=[];
  arr.forEach(function(x){
    var k;
    if(b==='mes')k=x.d.slice(0,7);
    else{var dt=parse(x.d),dow=(dt.getDay()+6)%7;k=addDays(x.d,-dow)}
    if(!map[k]){map[k]={k:k,v:0,n:0};ord.push(k)}
    map[k].v+=x.v;map[k].n++;
  });
  return ord.map(function(k){
    var o=map[k],l;
    if(b==='mes'){var p=k.split('-');l=MESES[+p[1]-1]+'/'+p[0].slice(2)}
    else l='sem. '+br(k).slice(0,5);
    return {l:l,s:k,v:o.v,d:k};
  });
}
function drawChart(){
  var el=$('chart');if(!el)return;
  if(st.bucketAuto){
    var dias=diffDays(st.ini,st.fim)+1,larg=Math.max(320,el.clientWidth||900)-52;
    st.bucket=(dias*3<=larg)?'dia':(Math.ceil(dias/7)*4<=larg?'semana':'mes');
    var selB=$('bk');if(selB)selB.value=st.bucket;
  }
  var m=st.met,arr=rng(m,st.ini,st.fim),bk=bucketize(arr,st.bucket),mm=mi(m);
  if(!bk.length){el.innerHTML='<div class="empty">Sem dados no período.</div>';return}
  var W=Math.max(320,el.clientWidth||900),H=Math.round(Math.min(340,Math.max(220,W*0.34)));
  var L=44,R=8,T=10,B=26,pw=W-L-R,ph=H-T-B;
  var vals=bk.map(function(x){return x.v}).slice().sort(function(a,b){return a-b});
  var mx=vals[vals.length-1]||1,capped=false;
  if(st.cap&&vals.length>8){var p95=vals[Math.floor(vals.length*0.95)];if(p95>0&&p95<mx*0.8){mx=p95*1.15;capped=true}}
  var ticks=4,stepv=niceStep(mx/ticks),ymax=stepv*ticks;if(ymax<mx&&!capped)ymax=Math.ceil(mx/stepv)*stepv;
  var col=css(mm.c),line=css('--line'),mut=css('--muted');
  var n=bk.length,bw=pw/n,g=[];
  for(var i=0;i<=ticks;i++){

    g.push('<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+line+'" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="'+mut+'">'+short(i*stepv)+'</text>');
  }

    return '<rect x="'+(L+i*bw+bw*0.12).toFixed(2)+'" y="'+(T+ph-h).toFixed(2)+'" width="'+Math.max(1,bw*0.76).toFixed(2)+'" height="'+Math.max(h,x.v>0?1:0).toFixed(2)+'" fill="'+col+'" rx="'+(bw>6?2:0)+'"/>'+(clip?'<path d="M'+(L+i*bw+bw/2-4).toFixed(1)+' '+(T+5)+'l4 -5l4 5z" fill="'+css('--neg')+'"/>':'');
  }).join('');
  var every=Math.max(1,Math.ceil(n/(W<520?5:9))),xl=[];
  bk.forEach(function(x,i){if(i%every===0)xl.push('<text x="'+(L+i*bw+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10.5" fill="'+mut+'">'+esc(x.l.length>6&&st.bucket==='dia'?x.l.slice(0,5):x.l)+'</text>')});
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" tabindex="0" aria-label="Gráfico de '+esc(mm.n)+', de '+br(st.ini)+' a '+br(st.fim)+'.">'+g.join('')+bars+xl.join('')+'<rect id="hit" x="'+L+'" y="'+T+'" width="'+pw+'" height="'+ph+'" fill="transparent"/></svg><div class="tip" id="tip"></div>'+
    (capped?'<p class="note">Escala limitada. Triângulos vermelhos indicam valores acima do topo do gráfico.</p>':'');
  var svg=el.querySelector('svg'),tip=$('tip'),idx=-1;
  function destacar(i){
    if(i<0||i>=n){tip.style.display='none';idx=-1;return}
    idx=i;var r=svg.getBoundingClientRect(),x=bk[i];
    tip.innerHTML='<b>'+esc(x.l)+'</b>: '+fmt(x.v);
    tip.style.display='block';
    tip.style.left=((L+i*bw+bw/2)*(r.width/W))+'px';
    tip.style.top=(T+ph-Math.min(ph,(x.v/ymax)*ph))*(r.height/H)+'px';
  }
  function mv(ev){
    var r=svg.getBoundingClientRect(),cx=(ev.touches?ev.touches[0].clientX:ev.clientX),px=(cx-r.left)*(W/r.width);
    destacar(Math.floor((px-L)/bw));
  }
  var hit=$('hit');
  hit.addEventListener('mousemove',mv);
  hit.addEventListener('touchstart',mv,{passive:true});
  hit.addEventListener('touchmove',mv,{passive:true});
  hit.addEventListener('mouseleave',function(){tip.style.display='none';idx=-1});
  svg.addEventListener('keydown',function(e){
    var k=e.key,i2;
    if(k==='ArrowRight')i2=idx<0?0:Math.min(n-1,idx+1);
    else if(k==='ArrowLeft')i2=idx<0?n-1:Math.max(0,idx-1);
    else if(k==='Home')i2=0;

}
function niceStep(x){if(x<=0)return 1;var e=Math.pow(10,Math.floor(Math.log10(x))),f=x/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function short(v){if(v>=1e6)return (v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi';if(v>=1e3)return (v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil';return v.toLocaleString('pt-BR')}

function conteudoPanel(){
  var ser=(DATA.series||{})[st.plat]||{};
  var metsC=['publicacoes','stories','visualizacoesStories','visualizacoes','alcance','interacoes'];
  var allD={};
  metsC.forEach(function(m){Object.keys(ser[m]||{}).forEach(function(d){allD[d]=1})});
  var datas=Object.keys(allD).sort();
  if(!datas.length)return '';
  var byYQ={};
  datas.forEach(function(d){
    var y=d.slice(0,4),mo=parseInt(d.slice(5,7),10),q=Math.ceil(mo/3),k=y+'-'+q;
    if(!byYQ[k])byYQ[k]={y:y,q:q,feed:0,stories:0,vizS:0,viz:0,alc:0,alcN:0,int:0};

    b.viz+=(ser.visualizacoes||{})[d]||0;
    var av=(ser.alcance||{})[d];if(av!==undefined){b.alc+=av;b.alcN++;}
    b.int+=(ser.interacoes||{})[d]||0;
  });
  var yqKeys=Object.keys(byYQ).sort().reverse();
  var years=[];yqKeys.forEach(function(k){var y=byYQ[k].y;if(years.indexOf(y)<0)years.push(y)});
  var hasFeed=yqKeys.some(function(k){return byYQ[k].feed>0}),hasStories=yqKeys.some(function(k){return byYQ[k].stories>0});
  var hasVizS=yqKeys.some(function(k){return byYQ[k].vizS>0}),hasViz=yqKeys.some(function(k){return byYQ[k].viz>0});
  var hasAlc=yqKeys.some(function(k){return byYQ[k].alcN>0}),hasInt=yqKeys.some(function(k){return byYQ[k].int>0});

  var thead='<tr><th>Trimestre</th>'+cols.map(function(c){return '<th>'+c.n+'</th>'}).join('')+'</tr>';
  var h='';

    var yKeys=yqKeys.filter(function(k){return byYQ[k].y===y});
    var T={feed:0,stories:0,vizS:0,viz:0,alc:0,alcN:0,int:0};
    var rows=yKeys.map(function(k){
      var b=byYQ[k];T.feed+=b.feed;T.stories+=b.stories;T.vizS+=b.vizS;T.viz+=b.viz;T.alc+=b.alc;T.alcN+=b.alcN;T.int+=b.int;

    }).join('');
    rows+='<tr class="tot"><td>Total</td>'+cols.map(function(c){return '<td>'+fmt(rowVal(T,c.k))+'</td>'}).join('')+'</tr>';
    h+='<div class="panel"><h2>Publicações e engajamento em '+esc(y)+'</h2><div class="tw"><table><thead>'+thead+'</thead><tbody>'+rows+'</tbody></table></div></div>';
  });
  return h;
}

  var bars=items.map(function(x,i){
    var w=bw*0.34,x0=L+i*bw+bw*0.12,ha=(x.a/ym)*ph,hb=x.b==null?0:(x.b/ym)*ph;
    return (x.b==null?'':'<rect x="'+x0.toFixed(1)+'" y="'+(T+ph-hb).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(hb,x.b>0?1:0).toFixed(1)+'" fill="#aab3ad" rx="1.5"/>')+'<rect x="'+(x0+w+1).toFixed(1)+'" y="'+(T+ph-ha).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(ha,x.a>0?1:0).toFixed(1)+'" fill="'+(mm.cor||'#1d4ed8')+'" rx="1.5"/><text x="'+(L+i*bw+bw/2).toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle" font-size="9.5" fill="#444">'+x.l+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img">'+g+bars+'</svg>';
}
function dailyBars(arr,cor,W,H){
  var L=40,R=4,T=6,B=20,pw=W-L-R,ph=H-T-B,mx=Math.max.apply(null,arr.map(function(x){return x.v}))||1,s4=niceStep(mx/4),ym=s4*4;if(ym<mx)ym=Math.ceil(mx/s4)*s4;
  var g='',n=arr.length,bw=pw/n,i;
  for(i=0;i<=4;i++){var y=T+ph-(i*s4/ym)*ph;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#e1e5e2"/><text x="'+(L-4)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="9" fill="#666">'+short(i*s4)+'</text>'}
  var b=arr.map(function(x,i){var h=(x.v/ym)*ph;return '<rect x="'+(L+i*bw).toFixed(2)+'" y="'+(T+ph-h).toFixed(2)+'" width="'+Math.max(0.8,bw*0.8).toFixed(2)+'" height="'+Math.max(h,x.v>0?0.8:0).toFixed(2)+'" fill="'+cor+'"/>'}).join('');
  var lb='',step=Math.max(1,Math.ceil(n/7));arr.forEach(function(x,i){if(i%step===0)lb+='<text x="'+(L+i*bw+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9.5" fill="#444">'+br(x.d).slice(0,5)+'</text>'});
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img">'+g+b+lb+'</svg>';
}
function edKey(f){return 'ascom-rel-'+REL.ano+'-'+REL.tri+'-'+f}
function edGet(f){try{return localStorage.getItem(edKey(f))||''}catch(e){return ''}}
function relPlat(p,Y,q,primeira){
  var old=st.plat;st.plat=p;
  var cur=qRange(Y,q),pq=q===1?qRange(Y-1,4):qRange(Y,q-1),py=qRange(Y-1,q);
  var mets=ORDEM.filter(function(k){return DATA.series[p]&&DATA.series[p][k]&&Object.keys(DATA.series[p][k]).length});
  var COR={visualizacoes:'#1d4ed8',alcance:'#0e9f6e',visualizadores:'#0e9f6e',interacoes:'#d97706',cliques:'#9333ea',visitas:'#1d4ed8',seguidores:'#0e9f6e'};
  var rows=mets.map(function(m){
    var mm=mi(m),v=kv(m,rng(m,cur.a,cur.b)),okp=comparavel(m,pq.a,pq.b),oky=comparavel(m,py.a,py.b);
    var vp=okp?kv(m,rng(m,pq.a,pq.b)):null,vy=oky?kv(m,rng(m,py.a,py.b)):null;
    if(m==='publicacoes'||m==='stories'){
      var field=m==='publicacoes'?'feed':'stories';var Cc=DATA.conteudo||{};
      var getC=function(yr,qi){var a=Cc[yr]&&Cc[yr][p];return a&&a[qi]?a[qi][field]||0:null;};
      var cf=getC(Y,q-1);if(!v&&cf!==null)v=cf;
      var cfp=getC(q===1?Y-1:Y,q===1?3:q-2);if(!vp&&cfp!==null){vp=cfp;okp=true;}
      var cfy=getC(Y-1,q-1);if(!vy&&cfy!==null){vy=cfy;oky=true;}
    }
    return '<tr><td>'+esc(mm.n)+(mm.t==='avg'?' (média/dia)':'')+'</td><td><b>'+fmt(v)+'</b></td><td>'+(okp?fmt(vp):'n/d')+'</td><td>'+ptxt(v,vp)+'</td><td>'+(oky?fmt(vy):'n/d')+'</td><td>'+ptxt(v,vy)+'</td></tr>';
  }).join('');
  var mini=mets.map(function(m){
    var mm=mi(m),items=[],ok=comparavel(m,py.a,py.b),i;
    for(i=0;i<3;i++){
      var mo=(q-1)*3+1+i,dim=new Date(Y,mo,0).getDate(),a=Y+'-'+pad(mo)+'-01',b=Y+'-'+pad(mo)+'-'+pad(dim);
      if(a>cur.b)break;if(b>cur.b)b=cur.b;
      var pa=(Y-1)+'-'+pad(mo)+'-01',pb=(Y-1)+'-'+pad(mo)+'-'+b.slice(8);
      items.push({l:MESES[mo-1],a:kv(m,rng(m,a,b)),b:ok?kv(m,rng(m,pa,pb)):null});
    }
    return '<div><b>'+esc(mm.n)+(mm.t==='avg'?' (média/dia)':'')+'</b>'+miniBars(items,{cor:COR[m]},300,104)+'</div>';
  }).join('');
  var vk=mets.indexOf('visualizacoes')>=0?'visualizacoes':mets[0],vm=mi(vk);
  var daily=dailyBars(rng(vk,cur.a,cur.b),COR[vk]||'#1d4ed8',720,115);
  var top=rng(vk,cur.a,cur.b).filter(function(x){return x.v>0}).sort(function(x,y){return y.v-x.v}).slice(0,3);
  var topT=top.length?'<div class="tw"><table style="max-width:340px"><thead><tr><th>Dia de maior destaque</th><th>'+esc(vm.n)+'</th></tr></thead><tbody>'+top.map(function(x){return '<tr><td>'+br(x.d)+'</td><td>'+fmt(x.v)+'</td></tr>'}).join('')+'</tbody></table></div>':'';
  var C=DATA.conteudo||{},cont='';
  [[Y,q],[Y-1,q]].forEach(function(yq){
    var c=C[yq[0]]&&C[yq[0]][p]&&C[yq[0]][p][yq[1]-1];if(!c)return;
    var al=(c.alcance||0)+(c.alcanceStories||0);
    cont+='<tr><td>'+yq[1]+'º tri de '+yq[0]+'</td><td>'+fmt(c.feed||0)+'</td><td>'+fmt(c.stories||0)+'</td><td>'+fmt(al)+'</td><td>'+fmt(c.reacoes||0)+'</td><td>'+fmt(c.comentarios||0)+'</td><td>'+fmt(c.compartilhamentos||0)+'</td></tr>';
  });
  if(cont)cont='<h3>Publicações e engajamento</h3><div class="tw"><table><thead><tr><th>Período</th><th>Feed</th><th>Stories</th><th>Alcance</th><th>Reações</th><th>Comentários</th><th>Compart.</th></tr></thead><tbody>'+cont+'</tbody></table></div><p class="nt">Dados do relatório trimestral da ASCOM. O alcance dessa tabela soma o alcance de cada publicação e não é comparável ao alcance médio diário do quadro acima.</p>';
  var notas=[];
  if(p==='instagram'&&mets.indexOf('visualizacoes')>=0)notas.push('As visualizações exportadas pela conta do Instagram somam Instagram e Facebook (cerca de 1% do total vem do Facebook).');
  if(mets.some(function(m){return mi(m).t==='avg'}))notas.push('Alcance e visualizadores contam contas ou pessoas únicas por dia, por isso são apresentados como média diária.');
  notas.push('n/d: o Meta não possui dados dessa métrica no período de comparação.');
  var html='<div class="secao'+(primeira?'':' novapag')+'"><h2>'+NOMES[p]+'</h2>'+
    '<div class="tw"><table><thead><tr><th>Métrica</th><th>'+q+'º tri '+Y+'</th><th>'+(q===1?'4º tri '+(Y-1):(q-1)+'º tri '+Y)+'</th><th>Variação</th><th>'+q+'º tri '+(Y-1)+'</th><th>Variação</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<p class="nt">'+(cur.full?'':'Trimestre parcial, com dados até '+br(cur.b)+'. ')+notas.join(' ')+'</p>'+
    '<h3>Evolução mensal (barra clara: mesmo mês de '+(Y-1)+')</h3><div class="mini">'+mini+'</div>'+
    '<h3>'+esc(vm.n)+' por dia</h3>'+daily+topT+cont+
    '<h3>Análise</h3><div class="ed" contenteditable="true" role="textbox" aria-multiline="true" data-f="an-'+p+'" data-ph="Clique aqui para escrever a análise do '+NOMES[p]+' neste trimestre (opcional).">'+esc(edGet('an-'+p))+'</div></div>';
  st.plat=old;return html;
}
function relHTML(){
  var u=last(),yrs=[],y;for(y=+first().slice(0,4);y<=+u.slice(0,4);y++)yrs.push(y);
  if(REL.ano===null){
    var uq=Math.ceil(+u.slice(5,7)/3),full=qRange(+u.slice(0,4),uq).full;
    REL.ano=+u.slice(0,4);REL.tri=full?uq:(uq===1?4:uq-1);if(!full&&uq===1)REL.ano--;
  }
  var h='<div class="relctl"><label>Ano<select id="rAno">'+yrs.map(function(y){return '<option'+(y===REL.ano?' selected':'')+'>'+y+'</option>'}).join('')+'</select></label>'+
    '<label>Trimestre<select id="rTri">'+[1,2,3,4].map(function(t){return '<option value="'+t+'"'+(t===REL.tri?' selected':'')+'>'+t+'º trimestre</option>'}).join('')+'</select></label>'+
    Object.keys(NOMES).filter(function(p){return p!=='consolidado'}).map(function(p){return '<label class="chk"><input type="checkbox" data-rp="'+p+'"'+(REL.plats[p]?' checked':'')+'> '+NOMES[p]+'</label>'}).join('')+
    '<button class="btn primary" id="rPdf" type="button">Gerar PDF</button></div>'+
    '<p class="note noprint" style="margin:-6px 0 14px">Os campos tracejados do relatório podem ser editados antes de gerar o PDF.</p>';
  var cur=qRange(REL.ano,REL.tri);
  if(cur.a>u){return h+'<div class="panel"><div class="empty"><b>Trimestre ainda sem dados</b>Escolha um trimestre que já tenha começado.</div></div>'}
  var plats=Object.keys(NOMES).filter(function(p){return p!=='consolidado'&&REL.plats[p]&&hasData(p)});
  h+='<div class="sheet"><div class="rh"><img src="'+LOGO+'" alt="UNIFESSPA ASCOM"><div><h1>Relatório trimestral das redes sociais</h1><p>'+REL.tri+'º trimestre de '+REL.ano+' ('+br(cur.a)+' a '+br(cur.b)+')</p><p>Universidade Federal do Sul e Sudeste do Pará, Assessoria de Comunicação</p></div></div>';
  h+=plats.map(function(p,i){return relPlat(p,REL.ano,REL.tri,i===0)}).join('');
  h+='<div class="secao"><h2>Considerações finais</h2><div class="ed" contenteditable="true" role="textbox" aria-multiline="true" data-f="final" data-ph="Clique aqui para escrever as considerações finais (opcional).">'+esc(edGet('final'))+'</div><p class="nt">Fonte: Meta Graph API (coleta automática diária). Relatório gerado em '+br(iso(new Date()))+'.</p></div></div>';
  return h;
}

/* =================== RENDER PRINCIPAL =================== */
function render(){
  var tabs=$('tabs');
  /* Tabs: Facebook | Instagram | Consolidado */
  tabs.innerHTML=['facebook','instagram','consolidado'].map(function(p){
    var cor=p==='facebook'?'var(--fb)':p==='instagram'?'var(--ig)':'var(--accent)';
    var sel=p===st.plat;
    return '<button class="tab" role="tab" id="tab-'+p+'" data-p="'+p+'" aria-selected="'+sel+'" aria-controls="app" tabindex="'+(sel?'0':'-1')+'" style="'+(sel?'background:'+cor+';border-color:'+cor+';color:#fff':'')+'">'+NOMES[p]+'</button>';
  }).join('');
  $('app').setAttribute('aria-labelledby','tab-'+st.plat);
  document.body.classList.toggle('rel',st.view==='rel');
  $('btnRel').textContent=st.view==='rel'?'Voltar ao painel':'Relatório detalhado';
  if(st.view==='rel'){tabs.innerHTML='';$('app').innerHTML=relHTML();return}
  renderPainel();
}

/* =================== EVENTOS =================== */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-p],[data-qsel],[data-qmet],[data-explmet]');if(!t)return;
  if(t.dataset.p){st.plat=t.dataset.p;render()}
  else if(t.dataset.qsel){st.quarter=+t.dataset.qsel;render()}
  else if(t.dataset.qmet){st.qmet=t.dataset.qmet;render()}
  else if(t.dataset.explmet){
    st.met=t.dataset.explmet;
    /* Atualizar chip selecionado sem re-render completo */
    document.querySelectorAll('[data-explmet]').forEach(function(el){el.setAttribute('aria-pressed',el.dataset.explmet===st.met)});
    var tt=$('expl-titulo');if(tt)tt.textContent=mi(st.met).n;
    var cur=qRange(st.year,st.quarter);
    drawChartExpl(st.plat,cur);
  }
});
$('tabs').addEventListener('keydown',function(e){
  if(['ArrowRight','ArrowLeft','Home','End'].indexOf(e.key)<0)return;
  var ts=[].slice.call(this.querySelectorAll('[role="tab"]')),i=ts.indexOf(document.activeElement);
  if(i<0)return;
  e.preventDefault();
  var j=e.key==='Home'?0:e.key==='End'?ts.length-1:e.key==='ArrowRight'?(i+1)%ts.length:(i-1+ts.length)%ts.length;
  ts[j].focus();ts[j].click();
});
document.addEventListener('change',function(e){
  if(e.target.id==='rAno'){REL.ano=+e.target.value;render()}
  else if(e.target.id==='rTri'){REL.tri=+e.target.value;render()}
  else if(e.target.dataset&&e.target.dataset.rp){REL.plats[e.target.dataset.rp]=e.target.checked;render()}
});
document.addEventListener('click',function(e){if(e.target.id==='rPdf')window.print()});
document.addEventListener('focusout',function(e){var t=e.target;if(t.dataset&&t.dataset.f&&t.classList.contains('ed')){try{localStorage.setItem(edKey(t.dataset.f),t.innerText.replace(/\n$/,''))}catch(x){}}});
$('btnRel').addEventListener('click',function(){st.view=st.view==='rel'?'painel':'rel';render();window.scrollTo(0,0)});
$('btnPrint').addEventListener('click',function(){window.print()});
$('btnMsgX').addEventListener('click',function(){$('msg').classList.remove('on')});
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if($('chart')){var cur=qRange(st.year,st.quarter);drawChartExpl(st.plat,cur)}},150)});
if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').addEventListener)
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){render()});

function showMsg(t){$('msgTxt').textContent=t;$('msg').classList.add('on')}

loadData(function(){
  var dq=defaultQ();
  if(dq){st.year=dq.y;st.quarter=dq.q}
  render();
});
})();
</script>
