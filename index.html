<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Métricas históricas das redes sociais da Unifesspa, de 2024 a setembro de 2026.">
  <link rel="icon" type="image/png" href="historico/assets/unifesspa.png">
  <title>Painel de métricas | ASCOM Unifesspa</title>
  <link rel="stylesheet" href="historico/style.css">
  <link rel="stylesheet" href="historico/interface/reports.css">
  <link rel="stylesheet" href="historico/interface/usability.css">
  <script src="historico/interface/features.js" defer></script>
  <script src="historico/interface/exports.js" defer></script>
  <script src="historico/interface/app.js?v=filtro-mensal" data-data-root="../data/" data-assets-root="../assets/" defer></script>
</head>
<body>
  <a class="skip" href="#content">Pular para o painel</a>
  <header class="top">
    <div class="wrap">
      <div class="top-in">
        <div class="brand"><img src="historico/assets/unifesspa.png" alt="Unifesspa — Assessoria de Comunicação"><h1>Métricas das redes sociais</h1></div>
        <div class="header-actions"><button class="button" id="btnExport" type="button">Exportar dados</button><button class="button primary" id="btnReport" type="button">Gerar relatório PDF</button></div>
      </div>
      <div class="tabs" role="tablist" aria-label="Rede social" id="tabs"></div>
    </div>
  </header>
  <main class="wrap">
    <section class="page-heading"><h2 id="page-title">Panorama do período</h2></section>
    <section class="period-controls" aria-label="Seleção de ano e período"><label for="year-select">Ano <select id="year-select"></select></label><label for="period-select">Trimestre <select id="period-select"></select></label><label for="month-select">Mês <select id="month-select"></select></label></section>
    <section id="period-status" class="period-status" aria-label="Referência e atualização" aria-live="polite"></section>
    <div id="content" role="tabpanel" tabindex="-1"><div class="loading">Preparando a base histórica…</div></div>
    <footer class="footer institutional-footer"><img src="historico/assets/unifesspa.png" alt="Unifesspa — Assessoria de Comunicação"><div><strong>Desenvolvido pela Assessoria de Comunicação</strong><span>Universidade Federal do Sul e Sudeste do Pará</span></div></footer>
  </main>
  <dialog id="report-dialog" class="config-dialog" aria-labelledby="report-dialog-title"></dialog>
  <dialog id="export-dialog" class="config-dialog" aria-labelledby="export-dialog-title"></dialog>
  <noscript>Ative o JavaScript para explorar os dados históricos. Os documentos também estão disponíveis na pasta data.</noscript>
</body>
</html>
