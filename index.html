<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Métricas das redes | ASCOM UNIFESSPA</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#eef0ef; --surface:#fff; --fg:#17251d; --muted:#586a5e; --line:#d7dcd8;
  --accent:#1d4ed8; --accent-bg:#eaf0fd; --pos:#15803d; --neg:#c62828;
  --c1:#1d4ed8; --c2:#0e9f6e; --c3:#d97706; --c4:#9333ea;
  --shadow:0 14px 36px -26px rgba(4,32,16,.45); --font:'Montserrat',Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10140f; --surface:#1a211a; --fg:#e9efea; --muted:#9db0a2; --line:#2c352c;
  --accent:#5b8bf0; --accent-bg:#1b2436; --pos:#5fd486; --neg:#ff8a8a;
  --c1:#5b8bf0; --c2:#34d399; --c3:#fbbf24; --c4:#c084fc;
  --shadow:0 14px 36px -26px rgba(0,0,0,.8);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:44px;width:auto;display:block}
.brand h1{margin:0;font-size:19px;font-weight:800}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.btn{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px;border-radius:10px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:6px 10px;min-height:32px;font-size:12px}
.tabs{display:flex;gap:6px;padding-bottom:10px;flex-wrap:wrap}
.tab{font:inherit;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--muted);padding:8px 16px;border-radius:99px;cursor:pointer;min-height:38px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:18px 0 40px}
.bar-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:99px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.dt{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
.dt input{font:inherit;width:106px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--fg);min-height:36px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;box-shadow:var(--shadow)}
.kpi[aria-pressed="true"]{border-color:var(--accent);outline:2px solid var(--accent-bg)}
.kpi .n{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;font-weight:700}
.kpi .d.up{color:var(--pos)} .kpi .d.dn{color:var(--neg)} .kpi .d.eq{color:var(--muted)}
.kpi svg{display:block;width:100%;height:30px;margin-top:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel h2{margin:0;font-size:16px;font-weight:800}
.panel .sub{margin:2px 0 12px;color:var(--muted);font-size:12.5px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.opts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.opts select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--fg);min-height:34px}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
#chart{position:relative}
#chart svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:3}
.twocol{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media(max-width:860px){.twocol{grid-template-columns:1fr}}
.twocol>*{min-width:0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:700}
tfoot td{font-weight:800;border-bottom:0}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:6px}
.msg{display:none;background:var(--accent-bg);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.msg.on{display:flex}
footer{margin-top:24px;text-align:center;color:var(--muted);font-size:12.5px}
.sr{position:absolute;left:-9999px}
@media print{header .btn,.bar-ctl,.msg,.opts,footer,.tabs{display:none!important}body{background:#fff;color:#000}.panel,.kpi{box-shadow:none;break-inside:avoid}}

/* relatório trimestral */
.relctl{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}
.relctl label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.relctl select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--fg);min-height:40px}
.relctl .chk{flex-direction:row;align-items:center;gap:6px;color:var(--fg);min-height:40px}
.sheet{background:#fff;color:#111;max-width:860px;margin:0 auto;padding:30px 34px;border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);font-family:var(--font)}
.sheet h1{font-size:21px;margin:0 0 2px;font-weight:800}
.sheet h2{font-size:17px;margin:0 0 10px;font-weight:800;padding-bottom:6px;border-bottom:2px solid #1d4ed8}
.sheet h3{font-size:13.5px;margin:16px 0 6px;font-weight:700}
.sheet .rh{display:flex;gap:16px;align-items:center;border-bottom:1px solid #d7dcd8;padding-bottom:14px;margin-bottom:6px}
.sheet .rh img{height:46px;width:auto}
.sheet .rh p{margin:0;font-size:12px;color:#444}
.sheet table{font-size:12px}
.sheet th{color:#444}
.sheet td,.sheet th{border-bottom:1px solid #dfe3e0}
.sheet .secao{margin-top:22px}
.sheet .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet .mini>div{border:1px solid #e1e5e2;border-radius:8px;padding:6px 8px;break-inside:avoid}
.sheet .mini b{font-size:11.5px;display:block}
.sheet .mini svg{width:100%;height:auto;display:block}
.sheet .d.up{color:#15803d}.sheet .d.dn{color:#c62828}.sheet .d.eq{color:#666}
.sheet .ed{min-height:84px;border:1px dashed #b8c0ba;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5;white-space:pre-wrap;outline:none}
.sheet .ed:empty:before{content:attr(data-ph);color:#8a948d}
.sheet .ed:focus{border-color:#1d4ed8;background:#f7f9ff}
.sheet .nt{font-size:11px;color:#555;margin:8px 0 0}
.sheet .leg{font-size:11px;color:#555;margin:4px 0 0}
@media(max-width:700px){.sheet{padding:18px 14px}.sheet .mini{grid-template-columns:repeat(2,1fr)}}
@media print{
  @page{size:A4;margin:13mm}
  body.rel{background:#fff}
  body.rel header.top,body.rel .relctl,body.rel .msg,body.rel footer{display:none!important}
  body.rel main{padding:0}.sheet{border:0;box-shadow:none;border-radius:0;padding:0;max-width:none}
  .sheet .secao.novapag{break-before:page}
  .sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet .ed{border:0;padding:0;min-height:0}.sheet .ed:empty{display:none}
  .noprint{display:none!important}
  .sheet h3:has(+ .ed:empty){display:none}
  .sheet td,.sheet th{padding:3.5px 6px}
  .sheet table{break-inside:avoid}.sheet h2,.sheet h3{break-after:avoid}
  .sheet .secao{margin-top:10px}.sheet h3{margin:8px 0 4px}.sheet .rh{padding-bottom:8px}.sheet .nt{margin:5px 0 0}.sheet .mini>div{padding:4px 6px}.sheet .ed{font-size:12px}
}
</style>
</head>

function bucketize(arr,b){
  if(b==='dia')return arr.map(function(x){return {l:br(x.d),s:x.d,v:x.v,d:x.d}});
  var map={},ord=[];

  });
  return ord.map(function(k){
    var o=map[k],l;
    if(b==='mes'){var p=k.split('-');l=MESES[+p[1]-1]+'/'+p[0].slice(2)}

    cont+='<tr><td>'+yq[1]+'º tri de '+yq[0]+'</td><td>'+fmt((c.feed||0)+(c.stories||0))+'</td><td>'+fmt(c.feed||0)+'</td><td>'+fmt(c.stories||0)+'</td><td>'+fmt(al)+'</td><td>'+fmt(c.reacoes||0)+'</td><td>'+fmt(c.comentarios||0)+'</td><td>'+fmt(c.compartilhamentos||0)+'</td></tr>';
  });
  if(cont)cont='<h3>Publicações e engajamento</h3><div class="tw"><table><thead><tr><th>Período</th><th>Publicações</th><th>Feed</th><th>Stories</th><th>Alcance</th><th>Reações</th><th>Comentários</th><th>Compart.</th></tr></thead><tbody>'+cont+'</tbody></table></div><p class="nt">Dados do relatório trimestral da ASCOM. O alcance dessa tabela soma o alcance de cada publicação e não é comparável ao alcance médio diário do quadro acima.</p>';
  var notas=[];
  if(p==='instagram'&&mets.indexOf('visualizacoes')>=0)notas.push('As visualizações exportadas pela conta do Instagram somam Instagram e Facebook (cerca de 1% do total vem do Facebook).');
  if(mets.some(function(m){return mi(m).t==='avg'}))notas.push('Alcance e visualizadores contam contas ou pessoas únicas por dia, por isso são apresentados como média diária.');
  notas.push('n/d: o Meta não possui dados dessa métrica no período de comparação.');
  var html='<div class="secao'+(p===Object.keys(REL.plats).filter(function(k){return REL.plats[k]})[0]?'':' novapag')+'"><h2>'+NOMES[p]+'</h2>'+
    '<div class="tw"><table><thead><tr><th>Métrica</th><th>'+q+'º tri '+Y+'</th><th>'+(q===1?'4º tri '+(Y-1):(q-1)+'º tri '+Y)+'</th><th>Variação</th><th>'+q+'º tri '+(Y-1)+'</th><th>Variação</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<p class="nt">'+(cur.full?'':'Trimestre parcial, com dados até '+br(cur.b)+'. ')+notas.join(' ')+'</p>'+
    '<h3>Evolução mensal (barra clara: mesmo mês de '+(Y-1)+')</h3><div class="mini">'+mini+'</div>'+
    '<h3>'+esc(vm.n)+' por dia</h3>'+daily+topT+cont+
    '<h3>Análise</h3><div class="ed" contenteditable="true" data-f="an-'+p+'" data-ph="Clique aqui para escrever a análise do '+NOMES[p]+' neste trimestre (opcional).">'+esc(edGet('an-'+p))+'</div></div>';
  st.plat=old;return html;
}
function relHTML(){
  var u=last(),yrs=[],y;for(y=+first().slice(0,4);y<=+u.slice(0,4);y++)yrs.push(y);
  if(REL.ano===null){
    var uq=Math.ceil(+u.slice(5,7)/3),full=qRange(+u.slice(0,4),uq).full;
    REL.ano=+u.slice(0,4);REL.tri=full?uq:(uq===1?4:uq-1);if(!full&&uq===1)REL.ano--;
  }
  var h='<div class="relctl"><label>Ano<select id="rAno">'+yrs.map(function(y){return '<option'+(y===REL.ano?' selected':'')+'>'+y+'</option>'}).join('')+'</select></label>'+
    '<label>Trimestre<select id="rTri">'+[1,2,3,4].map(function(t){return '<option value="'+t+'"'+(t===REL.tri?' selected':'')+'>'+t+'º trimestre</option>'}).join('')+'</select></label>'+
    Object.keys(NOMES).map(function(p){return '<label class="chk"><input type="checkbox" data-rp="'+p+'"'+(REL.plats[p]?' checked':'')+'> '+NOMES[p]+'</label>'}).join('')+
    '<button class="btn primary" id="rPdf" type="button">Gerar PDF</button></div>'+
    '<p class="note noprint" style="margin:-6px 0 14px">Os campos tracejados do relatório podem ser editados antes de gerar o PDF. Na janela de impressão, escolha "Salvar como PDF" e desative "Cabeçalhos e rodapés".</p>';
  var cur=qRange(REL.ano,REL.tri);
  if(cur.a>u){return h+'<div class="panel"><div class="empty"><b>Trimestre ainda sem dados</b>Escolha um trimestre que já tenha começado.</div></div>'}
  var plats=Object.keys(NOMES).filter(function(p){return REL.plats[p]&&hasData(p)});
  h+='<div class="sheet"><div class="rh"><img src="'+LOGO+'" alt="UNIFESSPA ASCOM"><div><h1>Relatório trimestral das redes sociais</h1><p>'+REL.tri+'º trimestre de '+REL.ano+' ('+br(cur.a)+' a '+br(cur.b)+')</p><p>Universidade Federal do Sul e Sudeste do Pará, Assessoria de Comunicação</p></div></div>';
  h+=plats.map(function(p){return relPlat(p,REL.ano,REL.tri)}).join('');
  h+='<div class="secao"><h2>Considerações finais</h2><div class="ed" contenteditable="true" data-f="final" data-ph="Clique aqui para escrever as considerações finais (opcional).">'+esc(edGet('final'))+'</div><p class="nt">Fonte: Meta Business Suite (exportações em CSV). Relatório gerado em '+br(iso(new Date()))+'.</p></div></div>';
  return h;
}

/* ---------- render ---------- */
function render(){
  var tabs=$('tabs');
  tabs.innerHTML=Object.keys(NOMES).map(function(p){return '<button class="tab" role="tab" data-p="'+p+'" aria-selected="'+(p===st.plat)+'">'+NOMES[p]+'</button>'}).join('');
  $('upd').textContent=DATA.atualizado?br(DATA.atualizado):'-';
  var app=$('app');
  document.body.classList.toggle('rel',st.view==='rel');$('btnRel').textContent=st.view==='rel'?'Voltar ao painel':'Relatório trimestral';
  if(st.view==='rel'){tabs.innerHTML='';app.innerHTML=relHTML();return}
  if(!hasData(st.plat)){
    app.innerHTML='<div class="panel"><div class="empty"><b>Ainda não há dados do '+NOMES[st.plat]+'</b>No Meta Business Suite, abra Insights, escolha a conta do '+NOMES[st.plat]+', selecione o período e use Exportar em cada métrica, formato CSV. Depois clique em Adicionar CSV no topo desta página.</div></div>';
    return;
  }
  var mets=ORDEM.concat(Object.keys(DATA.series[st.plat]).filter(function(k){return ORDEM.indexOf(k)<0})).filter(function(k){return DATA.series[st.plat][k]&&Object.keys(DATA.series[st.plat][k]).length});
  if(mets.indexOf(st.met)<0)st.met=mets[0];
  var len=diffDays(st.ini,st.fim)+1,pf=addDays(st.ini,-1),pi=addDays(pf,-(len-1)),lbl='vs '+len+' dias anteriores ('+br(pi).slice(0,5)+' a '+br(pf).slice(0,5)+(pi.slice(0,4)!==pf.slice(0,4)||true?'/'+pf.slice(0,4):'')+')';
  if(st.preset==='ano'){var py=+st.ini.slice(0,4)-1;pi=py+st.ini.slice(4);pf=py+st.fim.slice(4);lbl='vs mesmo período de '+py}
  var presets=[['ano','Este ano'],['mes','Mês atual'],['90','90 dias'],['30','30 dias'],['7','7 dias'],['tudo','Tudo']];
  var h='<div class="bar-ctl noprint"><div class="chips">'+presets.map(function(p){return '<button class="chip" data-pre="'+p[0]+'" aria-pressed="'+(st.preset===p[0])+'">'+p[1]+'</button>'}).join('')+'</div>'+
    '<div class="dt"><span>De</span><input id="di" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" value="'+br(st.ini)+'" aria-label="Data inicial"><span>até</span><input id="df" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" value="'+br(st.fim)+'" aria-label="Data final"></div></div>';
  h+='<div class="grid">'+mets.map(function(m){
    var a=rng(m,st.ini,st.fim),b=rng(m,pi,pf),v=kv(m,a),pv=kv(m,b),mm=mi(m),dl='';
    var fzm=firstNZ(m),hasPrev=fzm&&fzm<=addDays(pi,20);
    if(hasPrev&&pv>0){var pc=(v-pv)/pv*100;dl='<div class="d '+(pc>0.5?'up':pc<-0.5?'dn':'eq')+'">'+(pc>0?'+':'')+pc.toLocaleString('pt-BR',{maximumFractionDigits:1})+'% '+lbl+'</div>'}else dl='<div class="d eq">sem dados do período anterior</div>';
    return '<button class="kpi" data-met="'+m+'" aria-pressed="'+(m===st.met)+'"><div class="n">'+esc(mm.n)+(mm.t==='avg'?' (média/dia)':'')+'</div><div class="v">'+fmt(v)+'</div>'+dl+spark(a,css(mm.c))+'</button>';
  }).join('')+'</div>';
  var mm=mi(st.met);
  h+='<div class="panel"><div class="ph"><div><h2>'+esc(mm.n)+'</h2><p class="sub">'+br(st.ini)+' a '+br(st.fim)+'</p></div><div class="opts"><label>Agrupar por <select id="bk"><option value="dia">dia</option><option value="semana">semana</option><option value="mes">mês</option></select></label><label><input type="checkbox" id="cap"> Limitar picos</label></div></div><div id="chart"></div>'+(mm.nota?'<p class="note">'+esc(mm.nota)+'</p>':'')+(st.plat==='instagram'&&st.met==='visualizacoes'?'<p class="note">Atenção: o arquivo de Visualizações exportado com a conta do Instagram selecionada soma Instagram e Facebook (cerca de 1% do total vem do Facebook). Os demais indicadores são só do Instagram.</p>':'')+'</div>';
  h+='<div class="panel"><h2>Comparativo anual</h2><p class="sub">Mesmo intervalo do ano anterior, como no relatório de 2024 x 2025.</p>'+yoyTable(mets)+'</div>'+mesCmp()+conteudoPanel();
  h+='<div class="twocol"><div class="panel"><h2>Resumo por mês</h2><p class="sub">Totais mensais dentro do período selecionado.</p><div class="tw">'+monthTable(mets)+'</div></div><div class="panel"><h2>Dias de maior destaque</h2><p class="sub">'+esc(mm.n)+', maiores valores do período.</p><div class="tw">'+topDays()+'</div></div></div>';
  app.innerHTML=h;
  $('bk').value=st.bucket;$('cap').checked=st.cap;
  drawChart();
}
function monthTable(mets){
  var months={},ord=[];
  var d=st.ini;while(d<=st.fim){var k=d.slice(0,7);if(!months[k]){months[k]=1;ord.push(k)}d=addDays(d,1)}
  var show=mets.slice(0,6);
  var head='<tr><th>Mês</th>'+show.map(function(m){return '<th>'+esc(mi(m).n)+'</th>'}).join('')+'</tr>';
  var tot=show.map(function(){return 0}),body=ord.map(function(k){
    var a=k+'-01',b=addDays(a.slice(0,8)+'01',0),y=+k.slice(0,4),mo=+k.slice(5),lastd=new Date(y,mo,0).getDate();
    var ia=a<st.ini?st.ini:a,fb=k+'-'+pad(lastd),ib=fb>st.fim?st.fim:fb;
    return '<tr><td>'+MESES[mo-1]+'/'+k.slice(0,4)+'</td>'+show.map(function(m,i){
      var arr=rng(m,ia,ib),v=mi(m).t==='avg'?(arr.length?total(arr)/arr.length:0):total(arr);
      if(mi(m).t==='sum')tot[i]+=v;
      return '<td>'+fmt(v)+'</td>';
    }).join('')+'</tr>';
  }).join('');
  var foot='<tr><td>Total</td>'+show.map(function(m,i){return '<td>'+(mi(m).t==='sum'?fmt(tot[i]):'-')+'</td>'}).join('')+'</tr>';
  return '<table><thead>'+head+'</thead><tbody>'+body+'</tbody><tfoot>'+foot+'</tfoot></table>'+(show.some(function(m){return mi(m).t==='avg'})?'<p class="note">Visualizadores e Alcance aparecem como média diária de pessoas ou contas únicas.</p>':'');
}
function topDays(){
  var a=rng(st.met,st.ini,st.fim).filter(function(x){return x.v>0}).sort(function(x,y){return y.v-x.v}).slice(0,8);
  if(!a.length)return '<div class="empty">Sem dados.</div>';
  return '<table><thead><tr><th>Data</th><th>Valor</th></tr></thead><tbody>'+a.map(function(x){return '<tr><td>'+br(x.d)+'</td><td>'+fmt(x.v)+'</td></tr>'}).join('')+'</tbody></table>';
}

/* ---------- eventos ---------- */
function mask(i){i.addEventListener('input',function(){var v=i.value.replace(/\D/g,'').slice(0,8),o=v.slice(0,2);if(v.length>2)o+='/'+v.slice(2,4);if(v.length>4)o+='/'+v.slice(4);i.value=o})}
function pdate(t){var m=t.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(!m)return null;var d=new Date(+m[3],+m[2]-1,+m[1]);if(d.getMonth()!==+m[2]-1)return null;return iso(d)}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-p],[data-pre],[data-met]');if(!t)return;
  if(t.dataset.p){st.plat=t.dataset.p;render()}
  else if(t.dataset.pre){setPreset(t.dataset.pre);render()}
  else if(t.dataset.met){st.met=t.dataset.met;render()}
});
document.addEventListener('change',function(e){
  if(e.target.id==='bk'){st.bucket=e.target.value;drawChart()}
  else if(e.target.id==='cap'){st.cap=e.target.checked;drawChart()}
  else if(e.target.id==='di'||e.target.id==='df'){
    var a=pdate($('di').value),b=pdate($('df').value);
    if(a&&b&&a<=b){st.ini=a;st.fim=b;st.preset='';render()}else{showMsg('Datas inválidas. Use o formato dd/mm/aaaa, com a data inicial anterior à final.');$('btnDl').style.display='none';$('btnDiscard').style.display='none'}
  }
});
document.addEventListener('input',function(e){if(e.target.id==='di'||e.target.id==='df'){var i=e.target,v=i.value.replace(/\D/g,'').slice(0,8),o=v.slice(0,2);if(v.length>2)o+='/'+v.slice(2,4);if(v.length>4)o+='/'+v.slice(4);i.value=o}});
$('btnAdd').addEventListener('click',function(){$('file').click()});
$('file').addEventListener('change',function(){onFiles(this.files);this.value=''});

$('btnRel').addEventListener('click',function(){st.view=st.view==='rel'?'painel':'rel';render();window.scrollTo(0,0)});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='rAno'){REL.ano=+t.value;render()}
  else if(t.id==='rTri'){REL.tri=+t.value;render()}
  else if(t.dataset&&t.dataset.rp){REL.plats[t.dataset.rp]=t.checked;render()}
});
document.addEventListener('click',function(e){if(e.target.id==='rPdf')window.print()});
document.addEventListener('focusout',function(e){var t=e.target;if(t.dataset&&t.dataset.f&&t.classList.contains('ed')){try{localStorage.setItem(edKey(t.dataset.f),t.innerText.replace(/\n$/,''))}catch(x){}}});
$('btnPrint').addEventListener('click',function(){window.print()});
$('btnDiscard').addEventListener('click',function(){try{localStorage.removeItem(STORE)}catch(e){}location.reload()});
$('btnDl').addEventListener('click',function(){
  var blob=new Blob([JSON.stringify(DATA)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='metricas.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
});
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if($('chart'))drawChart()},150)});
if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener&&window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){render()});

loadData(function(){setPreset('ano');render();if(local)showMsg('Há dados adicionados neste navegador que ainda não foram publicados.')});
})();
</script>
</body>
