name: Diagnostico controlado de conta Meta
on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: 'Executar ate 16 GETs de leitura (sem publicar dados)'
        required: true
        default: false
        type: boolean
permissions: {}
concurrency:
  group: meta-account-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    if: ${{ inputs.confirm_read_only && github.run_attempt == 1 && github.ref == 'refs/heads/diagnostic/account-metrics-online' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Testar protecoes sem acesso a Meta
        run: python3 -B -m unittest discover -s tests -p 'test_diagnose_account_metrics.py' -v
      - name: Validar configuracao sem acesso a Meta
        run: python3 -B scripts/diagnose_account_metrics.py
      - name: Diagnosticar somente leitura
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python3 -B scripts/diagnose_account_metrics.py --execute-read-only
      - name: Verificar ausencia de alteracoes
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
